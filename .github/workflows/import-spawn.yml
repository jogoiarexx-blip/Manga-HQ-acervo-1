name: Importar Spawn A Idade das Trevas

on:
  push:
    branches:
      - spawn-import

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch temporaria
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se upload terminou
        id: ready
        shell: bash
        run: |
          if [ -f upload-parts/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruir e validar pacote
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          cat upload-parts/spawn.bundle.part-* > /tmp/spawn_acervo_bundle.zip
          unzip -tq /tmp/spawn_acervo_bundle.zip
          rm -rf /tmp/spawn-extracted
          mkdir -p /tmp/spawn-extracted
          unzip -q /tmp/spawn_acervo_bundle.zip -d /tmp/spawn-extracted
          test -f /tmp/spawn-extracted/colecoes/spawn-a-idade-das-trevas/series.json

      - name: Publicar edicoes na main
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git fetch origin main
          rm -rf /tmp/spawn-publish
          git worktree add -B spawn-publish-main /tmp/spawn-publish origin/main
          cd /tmp/spawn-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p colecoes/spawn-a-idade-das-trevas

          for issue in $(seq -w 1 28); do
            rm -rf "colecoes/spawn-a-idade-das-trevas/$issue"
            cp -a "/tmp/spawn-extracted/colecoes/spawn-a-idade-das-trevas/$issue" "colecoes/spawn-a-idade-das-trevas/$issue"
            git add "colecoes/spawn-a-idade-das-trevas/$issue"
            git commit -m "Adicionar Spawn: A Idade das Trevas #$issue"
            git push origin HEAD:main
          done

          cp "/tmp/spawn-extracted/colecoes/spawn-a-idade-das-trevas/series.json" "colecoes/spawn-a-idade-das-trevas/series.json"
          git add "colecoes/spawn-a-idade-das-trevas/series.json"
          git commit -m "Adicionar indice da serie Spawn: A Idade das Trevas"
          git push origin HEAD:main

      - name: Limpar branch temporaria
        if: steps.ready.outputs.ready == 'true' && success()
        shell: bash
        run: |
          git push origin --delete spawn-import || true
