name: Import Sonic PDFs 36-42

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-sonic-36-42.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: jogoiarexx-blip/Manga-HQ-acervo-1
    steps:
      - name: Download PDFs
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 20 -A "Mozilla/5.0" 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-dff4-820e-88d0-4ceb745b1c5d/raw?se=2026-09-22T16%3A57%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=fcb30b82-48df-54c3-9562-72ababae4369&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T14%3A30%3A23Z&ske=2026-09-23T14%3A30%3A23Z&sks=b&skv=2026-02-06&sig=MFl%2BLHkeuxsbKO7WH/fdmNe10rv5hdJYZ16sLD2N6iY%3D' -o /tmp/36.pdf
          test "$(stat -c%s /tmp/36.pdf)" -eq 11352091
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 20 -A "Mozilla/5.0" 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-ea28-81fa-96d9-0fa576a2c332/raw?se=2026-09-22T16%3A57%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=73de7264-96f3-549f-b6cb-79d7a878eecb&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T16%3A23%3A01Z&ske=2026-09-23T16%3A23%3A01Z&sks=b&skv=2026-02-06&sig=GShQ9Ftys3Dd%2BbnPvAWoBxCL1ILbCnAfHcPLHunSwQ0%3D' -o /tmp/37.pdf
          test "$(stat -c%s /tmp/37.pdf)" -eq 13398345
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 20 -A "Mozilla/5.0" 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b790-8210-a64d-604e2da35f13/raw?se=2026-09-22T16%3A57%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=385875f4-d7a4-54bf-b86e-bd607fa0bcc8&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T16%3A38%3A23Z&ske=2026-09-23T16%3A38%3A23Z&sks=b&skv=2026-02-06&sig=7GAyjYlmW0AvqaO1UTzFD1PznMYbNmwN793C14%2ByLFI%3D' -o /tmp/38.pdf
          test "$(stat -c%s /tmp/38.pdf)" -eq 10455509
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 20 -A "Mozilla/5.0" 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-af50-820e-965b-95079850dd1e/raw?se=2026-09-22T16%3A57%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=5a577119-6ed2-518a-826b-d8a3ae5e4bc4&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T15%3A03%3A07Z&ske=2026-09-23T15%3A03%3A07Z&sks=b&skv=2026-02-06&sig=F0N/nLYfSCne/n3A9qW3rDditFOP0xn02hUytVpf6OE%3D' -o /tmp/39.pdf
          test "$(stat -c%s /tmp/39.pdf)" -eq 10911099
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 20 -A "Mozilla/5.0" 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5408-81f4-9de4-9b602ac57d41/raw?se=2026-09-22T16%3A57%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=929e12fe-882d-5c6c-b7f4-d95e991ca51b&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T16%3A08%3A28Z&ske=2026-09-23T16%3A08%3A28Z&sks=b&skv=2026-02-06&sig=%2Ba%2BHilRdYR%2Bf1wd2pFleS9Kok2fy6mbujWFc%2B15zu2Y%3D' -o /tmp/40.pdf
          test "$(stat -c%s /tmp/40.pdf)" -eq 10489430
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 20 -A "Mozilla/5.0" 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7924-820e-860b-45d20dc85294/raw?se=2026-09-22T16%3A57%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=a9bf9b2a-97b8-5682-abb7-d39781d4c83a&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T14%3A39%3A25Z&ske=2026-09-23T14%3A39%3A25Z&sks=b&skv=2026-02-06&sig=pjL5Zj6IVsboFMVQ9ioPfOrHyaNQtQJ4mm0jOFExLmI%3D' -o /tmp/41.pdf
          test "$(stat -c%s /tmp/41.pdf)" -eq 10097257
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 20 -A "Mozilla/5.0" 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-2038-81f5-a85b-59b56538749f/raw?se=2026-09-22T16%3A57%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=66817d02-564e-5349-b6da-6cf2a7ad8c78&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T16%3A03%3A34Z&ske=2026-09-23T16%3A03%3A34Z&sks=b&skv=2026-02-06&sig=IcmzhTuU2yiBOqiHA7IkgWRcWz0yjNV46uX1qk31uLY%3D' -o /tmp/42.pdf
          test "$(stat -c%s /tmp/42.pdf)" -eq 9927292

      - name: Publish PDFs and update catalog
        shell: bash
        run: |
          cat > /tmp/publish.py <<'PY'
          import os, json, base64, urllib.request, urllib.error
          
          token=os.environ["GH_TOKEN"]
          repo=os.environ["GH_REPO"]
          api="https://api.github.com/repos/"+repo
          sizes={"36":11352091,"37":13398345,"38":10455509,"39":10911099,"40":10489430,"41":10097257,"42":9927292}
          
          def req(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(api+path,data=data,method=method,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"sonic-import-action"
              })
              try:
                  with urllib.request.urlopen(r,timeout=120) as resp:
                      if resp.status==204: return {}
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  raise RuntimeError(f"{method} {path} -> {e.code}: {body}") from e
          
          # Always build on the latest main.
          ref=req("GET","/git/ref/heads/main")
          parent=ref["object"]["sha"]
          commit=req("GET","/git/commits/"+parent)
          base_tree=commit["tree"]["sha"]
          
          tree=[]
          for n in range(36,43):
              p=f"/tmp/{n}.pdf"
              assert os.path.getsize(p)==sizes[str(n)] if isinstance(next(iter(sizes.keys())), str) else sizes[n]
              with open(p,"rb") as fh:
                  content=base64.b64encode(fh.read()).decode("ascii")
              blob=req("POST","/git/blobs",{"content":content,"encoding":"base64"})
              tree.append({
                  "path":f"colecoes/sonic/saga-29-49/{n}/Sonic-the-Hedgehog-{n}.pdf",
                  "mode":"100644","type":"blob","sha":blob["sha"]
              })
          
          # Update every catalog reference for #36-#42.
          cat=req("GET","/contents/catalogo.json?ref=main")
          catalog=json.loads(base64.b64decode(cat["content"]).decode("utf-8"))
          def walk(v):
              if isinstance(v,list):
                  for x in v: walk(x)
              elif isinstance(v,dict):
                  ident=v.get("id","")
                  if ident.startswith("sonic-the-hedgehog-"):
                      try: n=int(v.get("issue"))
                      except Exception: n=-1
                      if 36 <= n <= 42 and "size" in v:
                          v["size"]=sizes.get(str(n), sizes.get(n))
                  for x in v.values(): walk(x)
          walk(catalog)
          cat_blob=req("POST","/git/blobs",{"content":json.dumps(catalog,ensure_ascii=False,indent=2)+"\n","encoding":"utf-8"})
          tree.append({"path":"catalogo.json","mode":"100644","type":"blob","sha":cat_blob["sha"]})
          
          # Remove this temporary workflow from main in the same final commit.
          tree.append({"path":".github/workflows/import-sonic-36-42.yml","mode":"100644","type":"blob","sha":None})
          
          newtree=req("POST","/git/trees",{"base_tree":base_tree,"tree":tree})
          newcommit=req("POST","/git/commits",{
              "message":"Atualizar Sonic 36-42 com PDFs otimizados",
              "tree":newtree["sha"],
              "parents":[parent]
          })
          req("PATCH","/git/refs/heads/main",{"sha":newcommit["sha"],"force":False})
          
          # Cleanup temporary branch; ignore if it is already gone.
          try:
              req("DELETE","/git/refs/heads/tmp-sonic-36-42-import")
          except Exception as e:
              print("Aviso ao limpar branch temporária:",e)
          
          print("FINAL_COMMIT",newcommit["sha"])
          
          PY
          python3 /tmp/publish.py
