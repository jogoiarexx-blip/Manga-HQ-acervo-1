name: Importar Sonic the Hedgehog 13-20

on:
  push:
    branches:
      - sonic-import

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch temporaria
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se upload terminou
        id: ready
        shell: bash
        run: |
          if [ -f upload-parts/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruir e validar pacote
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat upload-parts/sonic-deploy.bigpart* > /tmp/sonic-deploy.zip
          unzip -tq /tmp/sonic-deploy.zip
          rm -rf /tmp/sonic-extracted
          mkdir -p /tmp/sonic-extracted
          unzip -q /tmp/sonic-deploy.zip -d /tmp/sonic-extracted
          test -f /tmp/sonic-extracted/colecoes/sonic/serie-principal/series.json
          for issue in 13 14 15 16 17 18 19 20; do
            test -f "/tmp/sonic-extracted/colecoes/sonic/serie-principal/$issue/manifest.json"
            test -f "/tmp/sonic-extracted/colecoes/sonic/serie-principal/$issue/001.webp"
          done

      - name: Publicar edicoes e atualizar catalogo
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/sonic-publish
          git worktree add -B sonic-publish-main /tmp/sonic-publish origin/main
          cd /tmp/sonic-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p colecoes/sonic/serie-principal

          for issue in 13 14 15 16 17 18 19 20; do
            rm -rf "colecoes/sonic/serie-principal/$issue"
            cp -a "/tmp/sonic-extracted/colecoes/sonic/serie-principal/$issue" "colecoes/sonic/serie-principal/$issue"
            git add "colecoes/sonic/serie-principal/$issue"
            git commit -m "Adicionar Sonic the Hedgehog #$issue"
            git push origin HEAD:main
          done

          cp "/tmp/sonic-extracted/colecoes/sonic/serie-principal/series.json" "colecoes/sonic/serie-principal/series.json"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("catalogo.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          page_counts = {13:33, 14:28, 15:28, 16:28, 17:31, 18:29, 19:30, 20:28}
          new_issues = []
          for n, count in page_counts.items():
              new_issues.append({
                  "id": f"sonic-the-hedgehog-{n}",
                  "issue": n,
                  "title": f"Sonic the Hedgehog #{n}",
                  "pageCount": count,
                  "cover": f"colecoes/sonic/serie-principal/{n}/001.webp",
                  "manifest": f"colecoes/sonic/serie-principal/{n}/manifest.json"
              })

          sonic = next((c for c in data.get("collections", []) if c.get("id") == "sonic"), None)
          if sonic is None:
              sonic = {"id": "sonic", "title": "Sonic the Hedgehog", "issues": []}
              data.setdefault("collections", []).append(sonic)

          ids = {x["id"] for x in new_issues}
          sonic["issues"] = [x for x in sonic.get("issues", []) if x.get("id") not in ids]
          sonic["issues"].extend(new_issues)

          items = [x for x in data.get("items", []) if x.get("id") not in ids]
          for issue in new_issues:
              item = dict(issue)
              item["collectionId"] = "sonic"
              item["collectionTitle"] = "Sonic the Hedgehog"
              items.append(item)
          data["items"] = items
          data["itemCount"] = len(items)

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git add "colecoes/sonic/serie-principal/series.json" catalogo.json
          git commit -m "Integrar Sonic the Hedgehog 13-20 ao catalogo"
          git push origin HEAD:main

      - name: Remover importador temporario da main
        if: steps.ready.outputs.ready == 'true' && success()
        shell: bash
        run: |
          cd /tmp/sonic-publish
          git rm -f .github/workflows/import-sonic.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "Remover importador temporario do Sonic"
            git push origin HEAD:main
          fi

      - name: Limpar branch temporaria
        if: steps.ready.outputs.ready == 'true' && success()
        shell: bash
        run: |
          git push origin --delete sonic-import || true
