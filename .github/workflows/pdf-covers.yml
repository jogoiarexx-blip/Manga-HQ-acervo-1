name: Gerar capas dos PDFs do Sonic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'colecoes/sonic/**/*.pdf'
      - '.github/workflows/pdf-covers.yml'

permissions:
  contents: write

concurrency:
  group: sonic-pdf-covers
  cancel-in-progress: true

jobs:
  gerar-capas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar somente arquivos necessários
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            catalogo.json
            colecoes/sonic
            .github/workflows/pdf-covers.yml

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install --upgrade pymupdf pillow

      - name: Gerar capas reais da primeira página
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import json
          import fitz
          from PIL import Image

          root = Path('.')
          catalog_path = root / 'catalogo.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          raw_prefix = 'https://raw.githubusercontent.com/jogoiarexx-blip/Manga-HQ-acervo-1/main/'

          by_id = {}
          for collection in catalog.get('collections', []):
              for issue in collection.get('issues', []):
                  by_id[str(issue.get('id'))] = issue

          changed = 0
          for item in catalog.get('items', []):
              if item.get('format') != 'pdf' or not str(item.get('id','')).startswith('sonic-the-hedgehog-'):
                  continue

              file_url = str(item.get('file') or '')
              if not file_url.startswith(raw_prefix):
                  print(f'AVISO: URL fora do repositório: {file_url}')
                  continue

              pdf = root / unquote(file_url[len(raw_prefix):])
              if not pdf.exists():
                  print(f'AVISO: PDF não encontrado: {pdf}')
                  continue

              cover = pdf.parent / 'cover.webp'
              if not cover.exists() or cover.stat().st_mtime < pdf.stat().st_mtime:
                  doc = fitz.open(pdf)
                  try:
                      page = doc.load_page(0)
                      pix = page.get_pixmap(matrix=fitz.Matrix(1.7, 1.7), alpha=False)
                      image = Image.frombytes('RGB', (pix.width, pix.height), pix.samples)
                      image.thumbnail((900, 1400), Image.Resampling.LANCZOS)
                      image.save(cover, 'WEBP', quality=84, method=6)
                      changed += 1
                      print(f'CAPA: {item.get("id")} -> {cover}')
                  finally:
                      doc.close()

              cover_url = raw_prefix + cover.as_posix()
              item['cover'] = cover_url
              if str(item.get('id')) in by_id:
                  by_id[str(item.get('id'))]['cover'] = cover_url

          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Capas novas/atualizadas: {changed}')
          PY

      - name: Salvar capas no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          find colecoes/sonic -name 'cover.webp' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Gerar capas dos PDFs do Sonic"
            git push
          fi
