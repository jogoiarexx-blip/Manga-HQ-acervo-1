<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manga HQ Acervo - Teste</title><style>body{font-family:system-ui;background:#101217;color:#eee;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}.card{background:#1b1f29;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}.card div{padding:10px}.ok{color:#7ee787}</style></head><body><div class="wrap"><h1>Manga HQ Acervo - Teste</h1><p id="s">Carregando…</p><div id="g" class="grid"></div></div><script>(async()=>{try{let c=await fetch('./catalogo.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});s.innerHTML='<span class="ok">✓ catálogo OK</span> — '+c.itemCount+' edições';for(let x of c.items){let a=document.createElement('article');a.className='card';a.innerHTML=`<img loading="lazy" src="${x.cover}" alt=""><div><b>${x.title}</b><br><small>${x.pageCount} páginas</small></div>`;g.append(a)}}catch(e){s.textContent='Erro: '+e.message}})()</script></body></html>
